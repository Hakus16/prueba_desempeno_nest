services:
  postgres_db:
    image: postgres:16-alpine
    container_name: fleetcore_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-fleetcore}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fleetcore_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-fleetcore}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetcore_api
    restart: always
    ports:
      - "${PORT:-3001}:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-fleetcore}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-super-seguro-fleetcore-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      API_KEYS: ${API_KEYS:-demo-key-partner-1,demo-key-partner-2}
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - fleetcore_network

networks:
  fleetcore_network:
    driver: bridge

volumes:
  postgres_data:
